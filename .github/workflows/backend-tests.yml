name: Backend tests (Tanga / AI / freeze)

# Runs the Tanga-currency + AI-limiter + freeze-idempotency suite against a
# REAL Postgres service container (not a mock, not SQLite) on every push/PR
# that touches the backend. This is the CI counterpart to
# backend/tests/run_tanga_tests_local.py, which does the same thing on a
# dev machine with no Docker via the `pgserver` embedded-Postgres package —
# GitHub Actions runners have Docker natively, so this uses the standard
# `services:` postgres container instead.

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sahifalab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sahifalab_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ensure psql client is present
        run: |
          command -v psql >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Apply schema (bootstrap + real Tanga/AI migrations)
        run: |
          psql "$DATABASE_URL" -f tests/schema_bootstrap.sql
          psql "$DATABASE_URL" -f migrations/088_tanga_currency.sql
          psql "$DATABASE_URL" -f migrations/089_ai_infrastructure.sql

      - name: Run Tanga / AI / freeze test suite
        run: |
          pytest -v -rA \
            tests/test_tanga_service.py \
            tests/test_ai_limiter.py \
            tests/test_tanga_reconciliation.py \
            tests/test_price_config_guard.py \
            tests/test_freeze_endpoint_idempotency.py \
            tests/test_freeze_service.py \
            tests/test_streak_state.py \
            tests/test_user_time.py
